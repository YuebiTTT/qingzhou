<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轻舟</title>
  <style>
    /* ====== Reset & Base ====== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --glass-bg: rgba(255,255,255,0.18);
      --glass-border: rgba(255,255,255,0.35);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.25);
      --blur: blur(18px);
      --radius: 18px;
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.80);
      --text-muted: rgba(255,255,255,0.60);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* ====== Background ====== */
    #bg {
      position: fixed; inset: 0;
      /* Rich gradient as instant fallback — looks good even if image never loads */
      background:
        linear-gradient(135deg,
          #0f0c29 0%,
          #302b63 40%,
          #24243e 70%,
          #0f0c29 100%
        );
      background-size: cover;
      z-index: 0;
    }
    #bg-image {
      position: fixed; inset: 0;
      background: center/cover no-repeat;
      opacity: 0;
      transition: opacity 1.5s ease;
      z-index: 0;
    }
    #bg-image.loaded { opacity: 1; }

    #bg-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0,0,0,0.30) 0%,
        rgba(0,0,0,0.10) 50%,
        rgba(0,0,0,0.35) 100%
      );
      z-index: 1;
      transition: backdrop-filter 0.5s, -webkit-backdrop-filter 0.5s;
    }
    body.searching #bg-overlay {
      backdrop-filter: blur(12px) brightness(0.7);
      -webkit-backdrop-filter: blur(12px) brightness(0.7);
    }

    /* ====== Layout ====== */
    #app {
      position: relative; z-index: 2;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      padding: 20px;
    }

    #center { text-align: center; }

    /* ====== Clock ====== */
    #clock {
      font-size: clamp(72px, 12vw, 120px);
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
      text-shadow: 0 2px 20px rgba(0,0,0,0.4);
      margin-bottom: 6px;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s;
    }

    #date-info {
      font-size: clamp(14px, 1.8vw, 18px);
      color: var(--text-secondary);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s;
    }

    /* Searching state — clock & date shrink up */
    body.searching #clock {
      transform: translateY(-20px) scale(0.55);
      opacity: 0.4;
    }
    body.searching #date-info {
      transform: translateY(-14px) scale(0.7);
      opacity: 0.3;
    }

    /* ====== Search Card ====== */
    #search-card {
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
      padding: 12px 14px;
      width: min(640px, 92vw);
      margin: 0 auto;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.4s,
                  border-color 0.4s,
                  width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.searching #search-card {
      width: min(720px, 96vw);
      transform: translateY(-8px);
      border-color: rgba(255,255,255,0.55);
      box-shadow: 0 12px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
    }

    #engine-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .engine-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .engine-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .engine-btn.active {
      background: rgba(255,255,255,0.30);
      border-color: rgba(255,255,255,0.60);
      color: #fff;
      font-weight: 600;
    }

    #search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font);
      font-size: 17px;
      color: #fff;
      padding: 6px 4px;
      transition: font-size 0.3s;
    }
    #search-input::placeholder { color: rgba(255,255,255,0.50); }
    body.searching #search-input { font-size: 20px; }

    #search-btn {
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.40);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      padding: 8px 18px;
      font-family: var(--font);
      font-size: 14px;
      transition: background 0.2s;
    }
    #search-btn:hover { background: rgba(255,255,255,0.40); }

    /* ====== Search Suggestions ====== */
    #suggestions {
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 6px;
      display: none;
    }
    #suggestions.show {
      display: block;
      animation: sugIn 0.18s ease;
    }
    @keyframes sugIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .suggestion-item {
      padding: 9px 10px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-secondary);
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .suggestion-item:hover,
    .suggestion-item.active {
      background: rgba(255,255,255,0.13);
      color: #fff;
    }

    /* ====== Shortcuts Bar ====== */
    #shortcuts {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 18px 20px 24px;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      pointer-events: none;
      z-index: 20;
    }
    #shortcuts.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    #shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 14px;
      width: min(680px, 94vw);
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      #shortcuts-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      position: relative;
    }

    .shortcut-icon {
      width: 54px; height: 54px;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: var(--glass-shadow);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, background 0.2s;
      overflow: hidden;
    }
    .shortcut:hover .shortcut-icon {
      transform: translateY(-3px) scale(1.06);
      background: rgba(255,255,255,0.30);
    }

    /* Letter avatar — instant, no network request */
    .shortcut-letter {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      user-select: none;
    }

    .shortcut-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 64px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* Edit overlay */
    .shortcut-edit-btn {
      position: absolute; top: -6px; right: -6px;
      width: 20px; height: 20px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      color: #fff; font-size: 10px;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10;
    }
    .shortcut:hover .shortcut-edit-btn { display: flex; }

    /* Add shortcut button */
    .shortcut-add {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .shortcut-add-icon {
      width: 54px; height: 54px;
      background: rgba(255,255,255,0.08);
      border: 2px dashed rgba(255,255,255,0.30);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .shortcut-add:hover .shortcut-add-icon {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.55);
      color: #fff;
      transform: translateY(-3px) scale(1.06);
    }
    .shortcut-add-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Bottom hint */
    #scroll-hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-muted);
      font-size: 18px;
      z-index: 15;
      animation: hintBounce 2s ease-in-out infinite;
      opacity: 0.5;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    #scroll-hint.hidden { opacity: 0; }
    @keyframes hintBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }

    /* ====== Motto ====== */
    #motto {
      position: fixed; bottom: 22px; right: 24px;
      max-width: 340px;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: var(--glass-shadow);
      padding: 12px 16px;
      z-index: 5;
      transition: opacity 0.35s, transform 0.35s;
    }
    #motto.push-up,
    body.searching #motto {
      opacity: 0;
      transform: translateY(10px);
    }
    #motto-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      font-style: italic;
    }
    #motto-author {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
      text-align: right;
    }

    /* ====== Bg refresh btn ====== */
    #refresh-bg {
      position: fixed; top: 18px; right: 18px;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s, color 0.2s, opacity 0.4s;
    }
    #refresh-bg:hover { background: rgba(255,255,255,0.30); color: #fff; }
    body.searching #refresh-bg { opacity: 0; pointer-events: none; }

    /* ====== Edit Modal ====== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: rgba(30,30,50,0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 20px;
      padding: 28px 30px;
      width: min(360px, 90vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal h3 { font-size: 16px; margin-bottom: 18px; font-weight: 600; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      color: #fff;
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: rgba(255,255,255,0.55); }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .btn { padding: 9px 22px; border-radius: 10px; font-family: var(--font); font-size: 13px; cursor: pointer; border: none; transition: 0.2s; }
    .btn-primary { background: rgba(255,255,255,0.25); color: #fff; border: 1px solid rgba(255,255,255,0.40); }
    .btn-primary:hover { background: rgba(255,255,255,0.40); }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.15); }
    .btn-secondary:hover { color: #fff; border-color: rgba(255,255,255,0.35); }
    .btn-danger { background: rgba(220,60,60,0.25); color: #ff9999; border: 1px solid rgba(220,60,60,0.35); }
    .btn-danger:hover { background: rgba(220,60,60,0.45); }
  </style>
</head>
<body>

<div id="bg"></div>
<div id="bg-image"></div>
<div id="bg-overlay"></div>

<button id="refresh-bg" title="换一张壁纸">🌄 换壁纸</button>

<div id="scroll-hint">⌄</div>

<!-- Main -->
<div id="app">
  <div id="center">
    <div id="clock">00:00:00</div>
    <div id="date-info">Loading...</div>

    <div id="search-card">
      <div id="engine-tabs">
        <button class="engine-btn active" data-engine="baidu">百度</button>
        <button class="engine-btn" data-engine="google">Google</button>
        <button class="engine-btn" data-engine="bing">必应</button>
      </div>
      <div id="search-row">
        <input id="search-input" type="text" placeholder="搜索…" autocomplete="off" />
        <button id="search-btn">搜索</button>
      </div>
      <div id="suggestions"></div>
    </div>
  </div>
</div>

<!-- Shortcuts bar (fixed, hidden by default) -->
<div id="shortcuts">
  <div id="shortcuts-grid"></div>
</div>

<!-- Motto -->
<div id="motto">
  <div id="motto-text">生活中没有什么可怕的东西，只有需要理解的东西。</div>
  <div id="motto-author">— 玛丽·居里</div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>✏️ 编辑快捷方式</h3>
    <div class="field">
      <label>网站名称</label>
      <input id="edit-name" type="text" placeholder="例：GitHub" />
    </div>
    <div class="field">
      <label>网址 URL</label>
      <input id="edit-url" type="url" placeholder="https://github.com" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="modal-delete">删除</button>
      <button class="btn btn-secondary" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  CONFIG & DEFAULTS
// ============================================================
const ENGINES = {
  baidu:  'https://www.baidu.com/s?wd=',
  google: 'https://www.google.com/search?q=',
  bing:   'https://www.bing.com/search?q='
};

const DEFAULT_SITES = [
  { name: 'Google',   url: 'https://google.com' },
  { name: 'YouTube',  url: 'https://youtube.com' },
  { name: 'GitHub',   url: 'https://github.com' },
  { name: '知乎',      url: 'https://zhihu.com' },
  { name: 'Bilibili', url: 'https://bilibili.com' },
  { name: '淘宝',      url: 'https://taobao.com' },
  { name: 'ChatGPT',  url: 'https://chat.openai.com' },
  { name: '微博',      url: 'https://weibo.com' }
];

const MOTTOS = [
  { text: '生活中没有什么可怕的东西，只有需要理解的东西。', author: '玛丽·居里' },
  { text: '你所浪费的今天，是昨天死去的人所奢望的明天。', author: '佚名' },
  { text: 'The best way to predict the future is to create it.', author: 'Peter Drucker' },
  { text: '不要等待机会，而要创造机会。', author: '林肯' },
  { text: '每一个不曾起舞的日子，都是对生命的辜负。', author: '尼采' },
  { text: 'In the middle of every difficulty lies opportunity.', author: 'Albert Einstein' },
  { text: '人生没有彩排，每天都是现场直播。', author: '佚名' },
  { text: '你若盛开，清风自来。', author: '仓央嘉措' },
  { text: 'Stay hungry, stay foolish.', author: 'Steve Jobs' },
  { text: '只要路是对的，就不怕路远。', author: '佚名' },
  { text: 'Simplicity is the ultimate sophistication.', author: 'Leonardo da Vinci' },
  { text: '种一棵树最好的时间是十年前，其次是现在。', author: '中国谚语' }
];

// ============================================================
//  STATE (backed by localStorage)
// ============================================================
const LS = {
  get(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; } },
  set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
};

let state = {
  engine:   LS.get('engine', 'baidu'),
  sites:    LS.get('sites',  DEFAULT_SITES),
  bgSeed:   LS.get('bgSeed', Math.random()),
  mottoIdx: LS.get('mottoIdx', Math.floor(Math.random() * MOTTOS.length))
};

function saveState() {
  LS.set('engine',   state.engine);
  LS.set('sites',    state.sites);
  LS.set('bgSeed',   state.bgSeed);
  LS.set('mottoIdx', state.mottoIdx);
}

// ============================================================
//  SHORTCUTS BAR — hover to show, leave to hide
// ============================================================
const shortcutsEl = document.getElementById('shortcuts');
const scrollHint  = document.getElementById('scroll-hint');
let shortcutsVisible = false;
let isHoveringBar = false;
let hideTimer = null;

function showShortcuts() {
  if (shortcutsVisible) return;
  shortcutsVisible = true;
  shortcutsEl.classList.add('visible');
  scrollHint.classList.add('hidden');
  document.getElementById('motto').classList.add('push-up');
  clearTimeout(hideTimer);
}

function hideShortcuts() {
  if (!shortcutsVisible) return;
  shortcutsVisible = false;
  shortcutsEl.classList.remove('visible');
  document.getElementById('motto').classList.remove('push-up');
  setTimeout(() => {
    if (!shortcutsVisible) scrollHint.classList.remove('hidden');
  }, 600);
}

function scheduleHide() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideShortcuts, 800);
}

// Show when mouse enters bottom area; schedule hide when mouse leaves it
document.addEventListener('mousemove', e => {
  const threshold = window.innerHeight * 0.78;
  if (e.clientY >= threshold) {
    showShortcuts();
    clearTimeout(hideTimer);
  } else if (shortcutsVisible && !isHoveringBar) {
    // Mouse moved out of bottom zone and isn't hovering the bar → start hide countdown
    scheduleHide();
  }
});

// Pin while hovering on the bar itself
shortcutsEl.addEventListener('mouseenter', () => {
  isHoveringBar = true;
  clearTimeout(hideTimer);
  showShortcuts();
});
shortcutsEl.addEventListener('mouseleave', () => {
  isHoveringBar = false;
  scheduleHide();
});

// ============================================================
//  CLOCK
// ============================================================
const WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const MONTHS   = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function pad(n) { return String(n).padStart(2, '0'); }

function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('date-info').textContent =
    `${now.getFullYear()} 年 ${MONTHS[now.getMonth()]} ${now.getDate()} 日　${WEEKDAYS[now.getDay()]}`;
}
tickClock();
setInterval(tickClock, 1000);

// ============================================================
//  BACKGROUND — gradient fallback + lazy image load
// ============================================================
function loadBg(seed) {
  const bgImgEl = document.getElementById('bg-image');
  // Always keep the CSS gradient as base — image overlays on top
  const w = Math.min(window.screen.width  || 1920, 1920);
  const h = Math.min(window.screen.height || 1080, 1080);
  const picId = (Math.floor(seed * 1e9) % 1000) + 1;
  const url = `https://picsum.photos/id/${picId}/${w}/${h}`;

  const img = new Image();
  // 8-second timeout — if image can't load, just keep gradient
  const timeout = setTimeout(() => {
    img.src = ''; // abort
  }, 8000);

  img.onload = () => {
    clearTimeout(timeout);
    bgImgEl.style.backgroundImage = `url('${url}')`;
    bgImgEl.classList.add('loaded');
  };
  img.onerror = () => {
    clearTimeout(timeout);
    // Try random fallback once
    const fallback = `https://picsum.photos/${w}/${h}?random=${Date.now()}`;
    const img2 = new Image();
    const t2 = setTimeout(() => { img2.src = ''; }, 6000);
    img2.onload = () => {
      clearTimeout(t2);
      bgImgEl.style.backgroundImage = `url('${fallback}')`;
      bgImgEl.classList.add('loaded');
    };
    img2.onerror = () => { clearTimeout(t2); };
    img2.src = fallback;
  };
  img.src = url;
}

loadBg(state.bgSeed);

document.getElementById('refresh-bg').addEventListener('click', () => {
  const btn = document.getElementById('refresh-bg');
  btn.textContent = '🔄 加载中…';
  state.bgSeed = Math.random();
  saveState();
  // Reset image layer
  const bgImgEl = document.getElementById('bg-image');
  bgImgEl.classList.remove('loaded');
  bgImgEl.style.backgroundImage = '';
  loadBg(state.bgSeed);
  // Button text resets after a reasonable wait
  setTimeout(() => { btn.textContent = '🌄 换壁纸'; }, 3000);
});

// ============================================================
//  SEARCH ENGINE
// ============================================================
function renderEngineTabs() {
  document.querySelectorAll('.engine-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.engine === state.engine);
  });
}
renderEngineTabs();

document.querySelectorAll('.engine-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.engine = btn.dataset.engine;
    saveState();
    renderEngineTabs();
    document.getElementById('search-input').focus();
    // Re-fetch suggestions for the new engine if there's text
    if (searchInput.value.trim()) fetchSuggestions(searchInput.value);
  });
});

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  window.open(ENGINES[state.engine] + encodeURIComponent(q), '_blank');
}

document.getElementById('search-btn').addEventListener('click', doSearch);
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    // If a suggestion is highlighted, use it as the search term
    if (activeSugIdx >= 0 && currentSugs[activeSugIdx]) {
      document.getElementById('search-input').value = currentSugs[activeSugIdx];
    }
    hideSugs();
    doSearch();
  }
});

// Focus search input immediately — don't wait for background image
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search-input').focus();
});

// ============================================================
//  SEARCH FOCUS — responsive page transitions
// ============================================================
const searchInput = document.getElementById('search-input');

searchInput.addEventListener('focus', () => {
  document.body.classList.add('searching');
});
searchInput.addEventListener('blur', () => {
  // Small delay so the transition feels smooth even on quick clicks
  setTimeout(() => {
    if (document.activeElement !== searchInput) {
      document.body.classList.remove('searching');
    }
  }, 200);
});
// Also toggle based on whether there is content (for click-away that refocuses)
searchInput.addEventListener('input', () => {
  if (searchInput.value.trim().length > 0) {
    document.body.classList.add('searching');
  }
});

// ============================================================
//  SEARCH SUGGESTIONS (autocomplete from search engines)
// ============================================================
const suggestionsEl = document.getElementById('suggestions');
let activeSugIdx = -1;
let currentSugs = [];
let typedBeforeNav = '';       // original input before arrow-key navigation
let sugVersion = 0;            // stale-response guard
let jsonpSeq = 0;

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function jsonp(url, cb, timeout = 3000) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    const timer = setTimeout(() => { delete window[cb]; s.remove(); reject(); }, timeout);
    s.onerror = () => { clearTimeout(timer); delete window[cb]; s.remove(); reject(); };
    window[cb] = d => { clearTimeout(timer); delete window[cb]; s.remove(); resolve(d); };
    document.head.appendChild(s);
  });
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function fetchSuggestions(q) {
  const ver = ++sugVersion;
  if (!q.trim()) { hideSugs(); return; }

  let items = [];

  try {
    if (state.engine === 'baidu') {
      const cbName = `_sug_${++jsonpSeq}`;
      const d = await jsonp(
        `https://suggestion.baidu.com/su?wd=${encodeURIComponent(q)}&cb=${cbName}`,
        cbName
      );
      items = (d.s || []).slice(0, 8);

    } else if (state.engine === 'google') {
      items = await fetchGoogleSuggestions(q, ver);

    } else if (state.engine === 'bing') {
      const cbName = `_sug_${++jsonpSeq}`;
      const d = await jsonp(
        `https://api.bing.com/qsonhs.aspx?type=cb&q=${encodeURIComponent(q)}&cb=${cbName}`,
        cbName
      );
      const r = d?.AS?.Results?.[0]?.Suggests || [];
      items = r.map(x => x.Txt).slice(0, 8);
    }
  } catch {
    if (ver === sugVersion) hideSugs();
    return;
  }

  if (ver !== sugVersion) return;
  currentSugs = items;
  renderSugs(items);
}

/**
 * Google Suggest — try multiple endpoints with automatic fallback.
 * 1. suggestqueries.google.com  (client=hp — Google Homepage, best JSONP support)
 * 2. www.google.com/complete/search  (client=psy-ab — Google Search page client)
 * 3. CORS fetch to suggestqueries.google.com  (client=firefox — plain JSON)
 */
async function fetchGoogleSuggestions(q, ver) {
  const eq = encodeURIComponent(q);

  // --- Attempt 1: suggestqueries.google.com with client=hp (homepage) ---
  try {
    const cb1 = `_sug_${++jsonpSeq}`;
    const d = await jsonp(
      `https://suggestqueries.google.com/complete/search?client=hp&hl=zh-CN&q=${eq}&callback=${cb1}`,
      cb1, 4000
    );
    if (ver !== sugVersion) return [];
    const items = parseGoogleResponse(d);
    if (items.length) return items;
  } catch { /* endpoint down or blocked — try next */ }

  // --- Attempt 2: www.google.com with client=psy-ab (search page client) ---
  try {
    const cb2 = `_sug_${++jsonpSeq}`;
    const d = await jsonp(
      `https://www.google.com/complete/search?client=psy-ab&hl=zh-CN&q=${eq}&callback=${cb2}`,
      cb2, 4000
    );
    if (ver !== sugVersion) return [];
    const items = parseGoogleResponse(d);
    if (items.length) return items;
  } catch { /* also blocked — try final fallback */ }

  // --- Attempt 3: CORS fetch (client=firefox returns plain JSON) ---
  try {
    const resp = await fetch(
      `https://suggestqueries.google.com/complete/search?client=firefox&hl=zh-CN&q=${eq}`,
      { signal: AbortSignal.timeout(4000) }
    );
    if (ver !== sugVersion) return [];
    const d = await resp.json();
    return parseGoogleResponse(d);
  } catch { /* all attempts failed */ }

  return [];
}

/** Parse Google response: ["query",["s1","s2",...],...] → suggestions array */
function parseGoogleResponse(d) {
  if (Array.isArray(d) && Array.isArray(d[1])) {
    return d[1].filter(s => typeof s === 'string').slice(0, 8);
  }
  return [];
}

function renderSugs(items) {
  if (!items.length) { hideSugs(); return; }

  suggestionsEl.innerHTML = items.map((t, i) =>
    `<div class="suggestion-item" data-i="${i}">${escHtml(t)}</div>`
  ).join('');
  suggestionsEl.classList.add('show');
  activeSugIdx = -1;

  // Click a suggestion → fill & search
  suggestionsEl.querySelectorAll('.suggestion-item').forEach(el => {
    el.addEventListener('click', () => {
      searchInput.value = el.textContent;
      hideSugs();
      doSearch();
    });
  });
}

function hideSugs() {
  suggestionsEl.classList.remove('show');
  suggestionsEl.innerHTML = '';
  currentSugs = [];
  activeSugIdx = -1;
}

// Keyboard navigation (↑↓) inside suggestions
searchInput.addEventListener('keydown', e => {
  if (!suggestionsEl.classList.contains('show')) return;
  const items = suggestionsEl.querySelectorAll('.suggestion-item');
  if (!items.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (activeSugIdx === -1) typedBeforeNav = searchInput.value;
    activeSugIdx = Math.min(activeSugIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeSugIdx));
    searchInput.value = activeSugIdx >= 0 ? currentSugs[activeSugIdx] : typedBeforeNav;
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeSugIdx = Math.max(activeSugIdx - 1, -1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeSugIdx));
    searchInput.value = activeSugIdx >= 0 ? currentSugs[activeSugIdx] : typedBeforeNav;
  } else if (e.key === 'Escape') {
    hideSugs();
  }
});

// Debounced input → fetch suggestions
const debouncedFetch = debounce(() => fetchSuggestions(searchInput.value), 200);
searchInput.addEventListener('input', debouncedFetch);

// Hide suggestions when input loses focus
searchInput.addEventListener('blur', () => setTimeout(hideSugs, 200));

// ============================================================
//  SHORTCUTS — letter avatars (zero network requests)
// ============================================================
let editingIdx = null;

// Distinct pastel hues for letter avatars
const AVATAR_HUES = [260, 200, 340, 30, 160, 50, 290, 120, 10, 220, 80, 310];

function getAvatarStyle(name, index) {
  const hue = AVATAR_HUES[index % AVATAR_HUES.length];
  return {
    bg: `hsl(${hue}, 45%, 35%)`,
    letter: name.charAt(0).toUpperCase()
  };
}

function renderShortcuts() {
  const grid = document.getElementById('shortcuts-grid');
  grid.innerHTML = '';
  state.sites.forEach((site, i) => {
    const a = document.createElement('div');
    a.className = 'shortcut';
    a.title = site.name;

    const iconDiv = document.createElement('div');
    iconDiv.className = 'shortcut-icon';

    // Use letter avatar — instant, no network, works offline
    const avatar = getAvatarStyle(site.name, i);
    iconDiv.style.background = avatar.bg;
    iconDiv.style.backdropFilter = 'none';
    iconDiv.style.webkitBackdropFilter = 'none';
    iconDiv.style.border = '1px solid rgba(255,255,255,0.15)';

    const letterSpan = document.createElement('span');
    letterSpan.className = 'shortcut-letter';
    letterSpan.textContent = avatar.letter;
    iconDiv.appendChild(letterSpan);

    const label = document.createElement('div');
    label.className = 'shortcut-label';
    label.textContent = site.name;

    const editBtn = document.createElement('div');
    editBtn.className = 'shortcut-edit-btn';
    editBtn.textContent = '✏️';
    editBtn.title = '编辑';
    editBtn.addEventListener('click', e => {
      e.stopPropagation();
      openEditModal(i);
    });

    a.appendChild(editBtn);
    a.appendChild(iconDiv);
    a.appendChild(label);

    // Click to navigate
    iconDiv.addEventListener('click', () => window.open(site.url, '_blank'));
    label.addEventListener('click', () => window.open(site.url, '_blank'));

    grid.appendChild(a);
  });

  // "+" add button
  const addBtn = document.createElement('div');
  addBtn.className = 'shortcut-add';
  addBtn.title = '添加快捷方式';
  addBtn.innerHTML = `
    <div class="shortcut-add-icon">+</div>
    <div class="shortcut-add-label">添加</div>
  `;
  addBtn.addEventListener('click', () => openAddModal());
  grid.appendChild(addBtn);
}
renderShortcuts();

// ============================================================
//  EDIT / ADD MODAL
// ============================================================
function openEditModal(idx) {
  editingIdx = idx;
  const site = state.sites[idx];
  document.querySelector('#edit-modal .modal h3').textContent = '✏️ 编辑快捷方式';
  document.getElementById('edit-name').value = site.name;
  document.getElementById('edit-url').value  = site.url;
  document.getElementById('modal-delete').style.display = '';
  document.getElementById('edit-modal').classList.add('open');
  document.getElementById('edit-name').focus();
}

function openAddModal() {
  editingIdx = null;
  document.querySelector('#edit-modal .modal h3').textContent = '➕ 添加快捷方式';
  document.getElementById('edit-name').value = '';
  document.getElementById('edit-url').value  = '';
  document.getElementById('modal-delete').style.display = 'none';
  document.getElementById('edit-modal').classList.add('open');
  document.getElementById('edit-name').focus();
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingIdx = null;
}

document.getElementById('modal-cancel').addEventListener('click', closeEditModal);

document.getElementById('modal-save').addEventListener('click', () => {
  const name = document.getElementById('edit-name').value.trim();
  let url    = document.getElementById('edit-url').value.trim();
  if (!name || !url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  if (editingIdx !== null) {
    state.sites[editingIdx] = { name, url };
  } else {
    state.sites.push({ name, url });
  }
  saveState();
  renderShortcuts();
  closeEditModal();
});

document.getElementById('modal-delete').addEventListener('click', () => {
  if (editingIdx === null) return;
  if (confirm(`删除「${state.sites[editingIdx].name}」？`)) {
    state.sites.splice(editingIdx, 1);
    saveState();
    renderShortcuts();
    closeEditModal();
  }
});

document.getElementById('edit-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('edit-modal')) closeEditModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeEditModal();
});

// ============================================================
//  MOTTO
// ============================================================
function renderMotto() {
  const m = MOTTOS[state.mottoIdx];
  document.getElementById('motto-text').textContent   = m.text;
  document.getElementById('motto-author').textContent = `— ${m.author}`;
}
renderMotto();

(function rotateMottoDailyIfNeeded() {
  const today = new Date().toDateString();
  const lastDate = LS.get('mottoDate', '');
  if (lastDate !== today) {
    state.mottoIdx = Math.floor(Math.random() * MOTTOS.length);
    LS.set('mottoDate', today);
    saveState();
    renderMotto();
  }
})();

document.getElementById('motto').addEventListener('click', () => {
  state.mottoIdx = (state.mottoIdx + 1) % MOTTOS.length;
  saveState();
  renderMotto();
});
</script>
